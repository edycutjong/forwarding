name: pages

# Deploys site/ (the landing page at /, the judge page at /judge, the deck at /pitch) to GitHub
# Pages at forwarding.edycu.dev (site/CNAME). Static only: every number on every page is a slot
# filled from docs/proof/*.json by scripts/render_site.py. The one live element — the "Run it
# live" box — calls the Vercel function cross-origin (api/lookup.py answers the preflight and sends
# Access-Control-Allow-Origin: *), so the Pages copy has the same live box as the Vercel copy.
#
# Pages does not run on a private repository on the free plan (the API answers 422 "Your current
# plan does not support GitHub Pages for this repository"). This workflow exists so the site goes
# live the moment the repository is public: `gh api -X POST repos/edycutjong/forwarding/pages
# -f build_type=workflow`, then run this workflow, then set the custom domain.

on:
  push:
    branches: [ "main" ]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  # release.yml tags from the commit subjects AFTER a push, so a deploy triggered by that same
  # push would stamp the PREVIOUS release and sit one version behind forever. Re-deploying when
  # release finishes closes that: the tag exists by then, and the stamp corrects itself.
  workflow_run:
    workflows: ["release"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Serialised, NOT cancel-in-progress: a push fires this workflow and release.yml fires it again
# through workflow_run; queueing keeps the Actions history free of "cancelled" runs.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      # The landing footer links "latest release" and the deck carries the version on its cover
      # and in its chrome. Both are stamped HERE rather than at render time: release.yml derives
      # the tag from the commits in the push that produced the page, so at render time the tag
      # does not exist yet, and the job that gates the rendered output against its templates
      # clones shallow with no tags at all. The committed HTML keeps the label / the version the
      # deck was rendered with, and the deploy substitutes the current tag over both.
      - name: Stamp the current release into the footer and the deck
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="$(gh release view --json tagName -q .tagName 2>/dev/null || true)"
          if [ -n "${TAG:-}" ]; then
            sed -i "s|>latest release<|>${TAG}<|g" site/index.html
            sed -i -E "s|(class=\"ver[^\"]*\"[^>]*>)v[0-9]+\.[0-9]+\.[0-9]+<|\1${TAG}<|g" site/pitch/index.html
            sed -i -E "s|(· MIT · )v[0-9]+\.[0-9]+\.[0-9]+<|\1${TAG}<|g" site/pitch/index.html
            echo "stamped ${TAG} into the footer and the deck"
          else
            echo "no published release yet — the footer keeps its label and the deck its rendered version"
          fi

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./site
      - id: deployment
        uses: actions/deploy-pages@v5
