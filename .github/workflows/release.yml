name: release

# Semantic versioning, computed from Angular-convention commit subjects since the last tag:
# feat -> minor, fix/perf -> patch, a ! or BREAKING CHANGE -> major, anything else -> no release.
# The version is therefore a consequence of what the commits say they did — it cannot drift
# from the changelog because it IS the changelog. v1.0.0 marks the build the receipts were taken
# on (pyproject.toml and the MCP server both declare 1.0.0); releases from here are 1.x.

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write        # required to push the tag and create the Release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0        # full history — we read commits since the last tag

      # The rule lives in scripts/next_version.sh — the same script the production-deploy job
      # in ci.yml stamps into the footer and the deck, so the pages and the tag cannot disagree.
      - name: Compute next version from Angular commits
        id: ver
        run: |
          set -euo pipefail
          LAST=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          BUMP=$(scripts/next_version.sh --bump)
          NEXT=$(scripts/next_version.sh)
          if [ "$BUMP" = none ]; then
            echo "No releasable commits since ${LAST:-the beginning}."
            echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "Bump: $BUMP  ${LAST:-none} -> $NEXT"
          echo "next=$NEXT"  >> "$GITHUB_OUTPUT"
          echo "bump=$BUMP"  >> "$GITHUB_OUTPUT"
          echo "skip=false"  >> "$GITHUB_OUTPUT"

      - name: Tag and publish the release
        if: steps.ver.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.ver.outputs.next }}" -m "${{ steps.ver.outputs.next }}"
          git push origin "${{ steps.ver.outputs.next }}"
          gh release create "${{ steps.ver.outputs.next }}" \
            --generate-notes --title "${{ steps.ver.outputs.next }}"
