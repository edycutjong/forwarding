[project]
name = "forwarding-address"
version = "1.0.0"
description = "Follow the wallet behind a large LP removal — keyless, live, from CoinMarketCap's DEX API"
requires-python = ">=3.11"
# runtime dependencies: none, by design — scripts/forwarding.py and scripts/mcp_server.py are stdlib-only
dependencies = []
license = "MIT"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# the landing template embeds long CSS/JS lines; wrapping them to 100 columns hurts more than it helps
"scripts/render_site.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["live: hits the real CoinMarketCap API"]

[tool.coverage.run]
# Coverage is measured on the judged path only: the engine, the MCP server and the two Vercel
# functions. seed.py, base_rate.py, bench.py, verify.py, spike_maker.py and render_site.py are
# omitted — CI EXECUTES them (make verify / check / bench), which is the stronger claim for a
# script whose job is to produce a receipt. check_submission_readiness.py is driven by its own
# test through a subprocess, which the tracer cannot see.
source = ["scripts", "api"]
omit = [
  "scripts/seed.py",
  "scripts/base_rate.py",
  "scripts/bench.py",
  "scripts/verify.py",
  "scripts/spike_maker.py",
  "scripts/render_site.py",
  "scripts/check_submission_readiness.py",
]

[tool.coverage.report]
skip_covered = false
show_missing = true
