[project]
name = "forwarding-address"
version = "1.0.0"
description = "Follow the wallet behind a large LP removal — keyless, live, from CoinMarketCap's DEX API"
requires-python = ">=3.11"
# runtime dependencies: none, by design — scripts/forwarding.py and scripts/mcp_server.py are stdlib-only
dependencies = []
license = "MIT"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# the landing template embeds long CSS/JS lines; wrapping them to 100 columns hurts more than it helps
"scripts/render_site.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["live: hits the real CoinMarketCap API"]

[tool.coverage.run]
# Every Python file in scripts/ and api/ is measured, branches included, and gated at 100%:
# the engine, the MCP server, the two Vercel functions, and every script that produces a
# receipt (seed, base_rate, bench, verify, spike_maker, render_site, the readiness scan).
# CI also EXECUTES the receipt scripts (make verify / check / bench) — that is the stronger
# claim for a script whose job is to produce a receipt; the unit tests are the second.
source = ["scripts", "api"]
branch = true

[tool.coverage.report]
skip_covered = false
show_missing = true
