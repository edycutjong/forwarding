[project]
name = "forwarding-address"
version = "1.0.0"
description = "Follow the wallet behind a large LP removal — keyless, live, from CoinMarketCap's DEX API"
requires-python = ">=3.11"
# runtime dependencies: none, by design — scripts/forwarding.py and scripts/mcp_server.py are stdlib-only
dependencies = []
license = "MIT"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# the landing template embeds long CSS/JS lines; wrapping them to 100 columns hurts more than it helps
"scripts/render_site.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["live: hits the real CoinMarketCap API"]
